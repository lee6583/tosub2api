server {
    listen 80;
    listen [::]:80;
    server_name tosub2.zrocode.org;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tosub2.zrocode.org;

    ssl_certificate /etc/letsencrypt/live/tosub2.zrocode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosub2.zrocode.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "toSub2";
    auth_basic_user_file /etc/nginx/tosub2.htpasswd;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4399;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
